<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Prince Muhindo Visanguliryo, Data Scientist and Analyst">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1620"/><stop offset="1" stop-color="#0f4c47"/></linearGradient>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#f0a93b"/></linearGradient></defs>
<style>
.n{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700;font-size:48px;fill:#fff}.t{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:24px;fill:#9fe3da}.s{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;fill:#b8c7d2}
.fade{opacity:0;animation:f 1s ease-out forwards}@keyframes f{to{opacity:1}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:r 1s ease-out backwards}@keyframes r{from{transform:scaleY(0)}}
.ln{fill:none;stroke:url(#ln);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:d 2.6s .6s ease-out forwards}@keyframes d{to{stroke-dashoffset:0}}
.dot{fill:#f0a93b;opacity:0;animation:f .5s 3s forwards}
@media (prefers-reduced-motion:reduce){.fade,.dot{animation:none;opacity:1}.bar{animation:none}.ln{animation:none;stroke-dashoffset:0}}
</style>
<rect width="1200" height="320" fill="url(#bg)"/>
<g stroke="#ffffff" stroke-opacity=".06"><line x1="0" x2="1200" y1="50" y2="50"/><line x1="0" x2="1200" y1="110" y2="110"/><line x1="0" x2="1200" y1="170" y2="170"/><line x1="0" x2="1200" y1="230" y2="230"/><line x1="0" x2="1200" y1="290" y2="290"/></g>
